name: Build SecureVault APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -q -o SecureVaultAndroid-Final.zip

      - name: Fix Java and Kotlin JVM versions
        run: |
          python3 <<'PY'
          from pathlib import Path

          file = Path("SecureVaultAndroidFinal/app/build.gradle.kts")
          text = file.read_text()

          marker = """    buildFeatures {
          """

          fix = """    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = "17"
          }

              buildFeatures {
          """

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              text = text.replace(marker, fix)

          file.write_text(text)
          PY

      - name: Build APK
        run: |
          gradle -p SecureVaultAndroidFinal assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-APK
          path: SecureVaultAndroidFinal/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
