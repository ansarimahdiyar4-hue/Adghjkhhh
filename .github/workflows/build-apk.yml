name: Build SecureVault APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: unzip -q SecureVaultAndroid-Final.zip

      - name: Build APK
        run: gradle -p SecureVaultAndroidFinal assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-APK
          path: SecureVaultAndroidFinal/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
